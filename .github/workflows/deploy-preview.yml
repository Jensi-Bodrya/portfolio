name: Preview & dev-2

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
    inputs:
      source_branch:
        description: Branch to deploy to dev-2 (main, or any feature branch)
        required: true
        default: main
        type: string

permissions:
  contents: read
  pull-requests: write
  actions: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site artifact
    runs-on: ubuntu-latest
    outputs:
      artifact: site-build-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_branch || '' }}
      - name: Build artifact
        env:
          BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.source_branch || github.ref_name }}
          SHA: ${{ github.sha }}
        run: python3 scripts/build_artifact.py --out build
      - uses: actions/upload-artifact@v4
        with:
          name: site-build-${{ github.run_id }}
          path: build/
          retention-days: 14

  preview:
    name: Deploy feature-branch preview
    if: github.event_name == 'push' && github.ref_name != 'main'
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: build
      - name: Derive preview domain from branch
        id: slug
        env:
          REF: ${{ github.ref_name }}
        run: |
          slug=$(printf '%s' "$REF" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9-]/-/g; s/--*/-/g; s/^-//; s/-$//' \
            | cut -c1-50)
          echo "domain=jensi-bodrya-${slug}.surge.sh" >> "$GITHUB_OUTPUT"
      - name: Install Surge
        run: npm install -g surge
      - name: Deploy preview
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: surge ./build "${{ steps.slug.outputs.domain }}"
      - name: Verify preview
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://${{ steps.slug.outputs.domain }}")
          echo "preview: https://${{ steps.slug.outputs.domain }} -> HTTP $code"
          [ "$code" = "200" ] || exit 1
      - name: Write preview link to job summary
        run: |
          {
            echo "### Feature branch preview"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| URL | https://${{ steps.slug.outputs.domain }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-dev2:
    name: Deploy dev-2
    if: github.event_name == 'workflow_dispatch'
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: dev-2
      url: https://jensi-bodrya-dev2.surge.sh
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: build
      - name: Show build metadata
        run: cat build/build-meta.json
      - name: Install Surge
        run: npm install -g surge
      - name: Deploy to dev-2
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: surge ./build jensi-bodrya-dev2.surge.sh
      - name: Verify dev-2
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://jensi-bodrya-dev2.surge.sh)
          echo "dev-2: HTTP $code"
          [ "$code" = "200" ] || exit 1
      - name: Write deployment summary
        run: |
          {
            echo "### dev-2 deployed"
            echo ""
            echo "Source branch: \`${{ inputs.source_branch }}\`"
            echo ""
            echo "URL: https://jensi-bodrya-dev2.surge.sh"
          } >> "$GITHUB_STEP_SUMMARY"