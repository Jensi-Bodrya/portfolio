name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  html-validate:
    name: HTML Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v7.2
        with:
          root: .
          css: false

  link-check:
    name: Broken Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: untitaker/hyperlink@0.1.43
        with:
          args: . --suffix html

  secrets-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: truffleHog scan
        uses: trufflesecurity/trufflehog@v3
        with:
          extra_args: --results=verified,unknown --fail

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for inline scripts
        run: |
          echo "Checking for inline event handlers..."
          if grep -rn 'onclick=\|onload=\|onerror=' index.html; then
            echo "Warning: inline event handlers found."
          else
            echo "OK: no inline event handlers."
          fi
      - name: Check file sizes
        run: |
          for f in index.html; do
            size=$(stat --format="%s" "$f")
            echo "$f: ${size}B"
          done

  deploy-dev:
    name: Deploy to Dev (Surge)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [html-validate, link-check, secrets-scan, code-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Surge
        run: npm install -g surge
      - name: Deploy to Surge
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: surge ./ jensi-bodrya-dev.surge.sh
      - name: Verify deployment
        run: 'curl -s -o /dev/null -w "HTTP %{http_code}\n" https://jensi-bodrya-dev.surge.sh'